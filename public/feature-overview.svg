<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" fill="#E5E7EB" font-size="28" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">Art Director Studio — Feature Overview</text>
  <text x="600" y="96" text-anchor="middle" fill="#9CA3AF" font-size="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">Homepage and Dashboard snapshots</text>

  <!-- Homepage card -->
  <g transform="translate(60,140)" filter="url(#shadow)">
    <rect width="520" height="360" rx="16" fill="url(#card)" stroke="#374151"/>
    <text x="24" y="40" fill="#F3F4F6" font-size="20" font-family="Inter, system-ui">Homepage</text>
    <rect x="24" y="64" width="472" height="56" rx="10" fill="#111827" stroke="#374151"/>
    <rect x="24" y="136" width="296" height="16" rx="8" fill="#1F2937"/>
    <rect x="24" y="160" width="360" height="16" rx="8" fill="#1F2937"/>
    <rect x="24" y="208" width="220" height="112" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="260" y="208" width="236" height="112" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="24" y="336" width="472" height="8" rx="4" fill="#374151"/>
  </g>

  <!-- Dashboard card -->
  <g transform="translate(620,140)" filter="url(#shadow)">
    <rect width="520" height="360" rx="16" fill="url(#card)" stroke="#374151"/>
    <text x="24" y="40" fill="#F3F4F6" font-size="20" font-family="Inter, system-ui">Dashboard</text>
    <rect x="24" y="64" width="160" height="32" rx="8" fill="#111827" stroke="#374151"/>
    <rect x="200" y="64" width="296" height="32" rx="8" fill="#111827" stroke="#374151"/>
    <rect x="24" y="112" width="472" height="144" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="24" y="272" width="148" height="88" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="192" y="272" width="148" height="88" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="360" y="272" width="136" height="88" rx="12" fill="#111827" stroke="#374151"/>
  </g>

  <!-- Legend -->
  <g>
    <circle cx="1040" cy="80" r="6" fill="#60A5FA"/>
    <text x="1056" y="84" fill="#9CA3AF" font-size="12" font-family="Inter, system-ui">Interactive modules</text>
    <circle cx="1040" cy="104" r="6" fill="#34D399"/>
    <text x="1056" y="108" fill="#9CA3AF" font-size="12" font-family="Inter, system-ui">Live metrics</text>
  </g>
</svg>
